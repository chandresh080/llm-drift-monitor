# Render Blueprint: deploys the FastAPI drift-monitor service from the repo Dockerfile.
services:
  - type: web
    name: llm-drift-monitor-api
    runtime: docker
    plan: free
    # Liveness, not readiness: this endpoint answers without initializing
    # the monitor, so platform restarts do not gate on model loading.
    healthCheckPath: /health/live
    envVars:
      - key: DRIFT_MONITOR_CONFIG
        value: /app/config/config.gemini.yaml
      # The hosted demo monitors Gemini itself through the native adapter.
      # The key is set only in the Render secret store; the service starts
      # the panels on stored data and reports the provider unavailable
      # explicitly until it is provided. No fallback to a synthetic adapter,
      # so there is nothing to mistake for real provider evidence.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Tracking is memory safe: each cycle logs to MLflow from a short
      # lived subprocess, so mlflow never enters the serving process. Runs
      # land in the container's SQLite-backed mlflow.db; the free tier resets
      # the disk on redeploy, so the store is per deployment lifetime.
      - key: DRIFT_MONITOR_TRACKING
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Free-tier RAM hygiene: cap glibc arenas + torch/transformers thread pools.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      # The embedding model runs on ONNX Runtime: the torch stack loading mid
      # cycle peaked past the free tier's 512 MB ceiling (observed 127 -> 505 MB
      # then an OOM kill dropped the cycle and reset the disk). The ONNX graph
      # is baked into the image; see embeddings.py for the selection contract.
      - key: DRIFT_MONITOR_EMBEDDING_BACKEND
        value: "onnx"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
